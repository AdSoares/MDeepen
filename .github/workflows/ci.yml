name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build, type check and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package
        run: npx vsce package --no-dependencies --out mdeepen-ci.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: mdeepen-vsix
          path: mdeepen-ci.vsix
          if-no-files-found: error
